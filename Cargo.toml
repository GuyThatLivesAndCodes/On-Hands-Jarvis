[package]
name = "on-hands-jarvis"
version = "0.1.0"
edition = "2021"
description = "On-Hands Jarvis - a voice-activated desktop AI assistant"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# Async + HTTP for AI integration
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Audio + DSP for wake-word
cpal = "0.15"
rustfft = "6"
hound = "3"

# Screen capture + QR scanning
xcap = "0.0.14"
rqrr = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# System control
enigo = "0.2"
sysinfo = "0.31"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
